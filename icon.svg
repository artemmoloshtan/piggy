<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F5B700"/>
    </linearGradient>
    <linearGradient id="pigBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB3C6"/>
      <stop offset="100%" stop-color="#FF8DA1"/>
    </linearGradient>
    <linearGradient id="btcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="stockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#804400" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular / Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#D99B00" stroke-width="4"/>

  <g filter="url(#shadow)">
    <!-- Curly Tail (Behind Piggy) -->
    <path d="M 370 265 
             C 415 265, 435 235, 420 215 
             C 405 195, 375 210, 390 235 
             C 398 248, 412 245, 415 240" 
          fill="none" stroke="#2B1810" stroke-width="14" stroke-linecap="round"/>

    <!-- Stock Market Coin (Back coin in top slot) -->
    <g transform="translate(290, 160)">
      <circle cx="0" cy="0" r="48" fill="url(#stockGrad)" stroke="#2B1810" stroke-width="12"/>
      <!-- Stock Upward Trend Arrow -->
      <path d="M -22 14 L -6 2 L 6 10 L 22 -10" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 10 -10 L 22 -10 L 22 2" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bitcoin Coin (Front coin in top slot) -->
    <g transform="translate(230, 175)">
      <circle cx="0" cy="0" r="54" fill="url(#btcGrad)" stroke="#2B1810" stroke-width="12"/>
      <text x="0" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" text-anchor="middle" stroke="#2B1810" stroke-width="2">₿</text>
    </g>

    <!-- Back Ear -->
    <path d="M 180 185 C 150 115, 205 95, 225 155 Z" fill="#E64980" stroke="#2B1810" stroke-width="12" stroke-linejoin="round"/>

    <!-- Back Foot -->
    <rect x="250" y="360" width="38" height="42" rx="16" fill="#FF8DA1" stroke="#2B1810" stroke-width="12"/>

    <!-- Front Foot -->
    <rect x="295" y="360" width="38" height="42" rx="16" fill="#FF8DA1" stroke="#2B1810" stroke-width="12"/>

    <!-- Piggy Main Body -->
    <ellipse cx="265" cy="285" rx="125" ry="100" fill="url(#pigBodyGrad)" stroke="#2B1810" stroke-width="13"/>

    <!-- Front Ear -->
    <path d="M 235 190 C 230 110, 280 120, 275 185 Z" fill="#FF8DA1" stroke="#2B1810" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 245 175 C 242 135, 268 140, 265 172 Z" fill="#FFA8BA"/>

    <!-- Eye 1 -->
    <ellipse cx="178" cy="235" rx="8" ry="11" fill="#2B1810"/>
    <circle cx="180" cy="232" r="3" fill="#FFFFFF"/>

    <!-- Eye 2 -->
    <ellipse cx="218" cy="242" rx="8" ry="11" fill="#2B1810"/>
    <circle cx="220" cy="239" r="3" fill="#FFFFFF"/>

    <!-- Tax Report Paper Sheet Held in Mouth -->
    <g transform="translate(85, 290)">
      <!-- Sheet background with rounded corners & dark outline -->
      <path d="M 0 0 L 85 0 C 95 0, 100 5, 100 15 L 100 110 C 100 120, 95 125, 85 125 L 15 125 C 5 125, 0 120, 0 110 Z" 
            fill="#FFFFFF" stroke="#2B1810" stroke-width="13" stroke-linejoin="round"/>
      
      <!-- Fold / Notch at Top Right -->
      <path d="M 75 0 L 100 25 L 75 25 Z" fill="#E2E8F0" stroke="#2B1810" stroke-width="7" stroke-linejoin="round"/>
      
      <!-- Financial Report Bars (Blue, Orange, Green) -->
      <!-- Top Bar: Blue -->
      <rect x="18" y="32" width="62" height="13" rx="6.5" fill="#0284C7"/>
      <!-- Middle Bar: Amber/Orange -->
      <rect x="18" y="56" width="46" height="13" rx="6.5" fill="#F59E0B"/>
      <!-- Bottom Bar: Emerald Green -->
      <rect x="18" y="80" width="64" height="13" rx="6.5" fill="#10B981"/>
    </g>

    <!-- Snout Clamped Firmly Over Paper -->
    <ellipse cx="168" cy="290" rx="34" ry="26" fill="#FFA8BA" stroke="#2B1810" stroke-width="13"/>
    <ellipse cx="158" cy="290" rx="5.5" ry="9" fill="#2B1810"/>
    <ellipse cx="178" cy="290" rx="5.5" ry="9" fill="#2B1810"/>
  </g>
</svg>
